[phases.setup]
nixPkgs = ["nodejs", "ffmpeg", "curl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  # Download the latest yt-dlp binary from GitHub and replace the stale npm-bundled one.
  # This avoids PATH issues and ensures the binary supports modern YouTube clients.
  "curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o node_modules/youtube-dl-exec/bin/yt-dlp",
  "chmod +x node_modules/youtube-dl-exec/bin/yt-dlp",
  "echo 'yt-dlp version:' && node_modules/youtube-dl-exec/bin/yt-dlp --version",
  "npm run build"
]
